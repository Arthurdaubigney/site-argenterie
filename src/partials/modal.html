  <dialog class="modal-root" aria-labelledby="modal-title" data-modal>
    <div class="modal-veil fixed inset-0 bg-[#0d1013]/55 backdrop-blur-[3px]" data-modal-close></div>
    <div class="pointer-events-none fixed inset-0 flex items-end justify-center sm:items-center sm:p-6">
      <div class="t-modal relative flex max-h-[92dvh] w-full max-w-2xl flex-col overflow-hidden rounded-t-[2px] border border-line bg-surface sm:rounded-[2px]" data-modal-panel>
        <div class="flex items-center justify-between gap-4 border-b border-line px-5 py-4 sm:px-8">

          <button type="button" class="inline-flex h-11 w-11 items-center justify-center text-ink-2 hover:text-ink" data-modal-close>

        </div>
      </div>
    </div>
